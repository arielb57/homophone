name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lints run on a pinned toolchain. `-D warnings` on a floating `stable` means
  # a new clippy release breaks the build with no change to this repository,
  # which makes CI a clock rather than a check. Bump this deliberately.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # The MSRV in Cargo.toml is a promise, so it gets tested rather than asserted.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: CLI smoke run
        run: |
          cargo run --release -- synth --out corpus.txt --letters 500000
          cargo run --release -- train-model --corpus corpus.txt --out model.bin
          cargo run --release -- synth --out plain.txt --letters 1500 --seed 7
          cargo run --release -- encrypt --input plain.txt --symbols 60 --seed 7 > cipher.txt
          cargo run --release -- solve --model model.bin --input cipher.txt --truth plain.txt
